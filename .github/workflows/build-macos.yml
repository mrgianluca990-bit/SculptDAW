      - name: Apply repository Core17 patch and verify native .scdaw (prebuild)
        shell: bash
        run: |
          set -euo pipefail
          # Already committed in SculptDAW; fail early if the file is missing.
          test -s QA/SculptDAW_Core17_Patch.py
          python3 -m py_compile QA/SculptDAW_Core17_Patch.py
          python3 QA/SculptDAW_Core17_Patch.py
          # Manifest must be modified before the packaging process runs.
          python3 - <<'PY_AUDIT'
          from pathlib import Path
          import plistlib
          p=Path('packaging/macos/Info.plist.in')
          info=plistlib.loads(p.read_bytes())
          uti=info['UTExportedTypeDeclarations'][0]
          assert uti['UTTypeIdentifier']=='audio.sculpt.daw.session', uti
          assert 'scdaw' in uti['UTTypeTagSpecification']['public.filename-extension'], uti
          assert all('ai.storyteller.soundcraft.session' != t.get('UTTypeIdentifier') for t in info['UTExportedTypeDeclarations'])
          assert 'View > Rulers > Markers' in Path('sculpt/qa-core-menu.txt').read_text()
          assert 'Window > Memory Locations' in Path('sculpt/qa-core-menu.txt').read_text()
          print('CORE17: patch + plist + marker UI verified BEFORE compile')
          PY_AUDIT
