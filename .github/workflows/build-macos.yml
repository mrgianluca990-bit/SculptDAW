      - name: Install Rust for both Mac architectures
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Validate and regression test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CHECK'
          from pathlib import Path
          e=Path('crates/ui-egui/src/edit_window.rs').read_text()
          d=Path('crates/ui-egui/src/dialogs.rs').read_text()
          assert 'SCULPT_CORE16_SPOT_CLICK' in e and 'SCULPT_CORE16_SPOT_DRAG' in e
          assert 'SCULPT_CORE16_SPOT_CONFIRM' in d
          assert 'SCULPT_CORE16_EDIT_FADER_PAN' in e
          print('Source guards OK')
          PY_CHECK
          cargo check --locked --target x86_64-apple-darwin -p sculpt-daw
          cargo test --locked --target x86_64-apple-darwin -p soundcraft-engine --lib sculpt_
          # All new Core17 regression cases are included in the same library test set.
          cargo test --locked --target x86_64-apple-darwin -p soundcraft-engine --lib sculpt_core17_
          cargo test --locked --target x86_64-apple-darwin -p soundcraft-engine --lib sculpt_core18_
          cargo test --locked --target x86_64-apple-darwin -p soundcraft-engine --lib sculpt_core19_
          cargo test --locked --target x86_64-apple-darwin -p soundcraft-ui-egui --lib sculpt_core18_
          cargo test --locked --target x86_64-apple-darwin -p soundcraft-mix --lib
          cargo test --locked --target x86_64-apple-darwin -p soundcraft-ui-egui --lib sculpt_
          cargo test --locked --target x86_64-apple-darwin -p soundcraft-ui-egui --test shortcuts
          cargo test --locked --target x86_64-apple-darwin -p soundcraft-playback --lib
          cargo test --locked --target x86_64-apple-darwin -p soundcraft-vst3-host --test fixture_e2e
          cargo test --locked --target x86_64-apple-darwin -p soundcraft-au-host --test system_units
      - name: Build Sculpt DAW Mac app
        shell: bash
        run: bash sculpt/build-macos.sh
      - name: Validate native document and zip
        shell: bash
        run: |
          set -euo pipefail
          ZIP=dist/sculpt/Sculpt_DAW_0.4.0_Mac_Universal.zip
          test -s "$ZIP"
          shasum -a 256 -c "$ZIP.sha256"
          unzip -t "$ZIP" > /dev/null
          python3 - <<'PY_PLIST'
          from pathlib import Path
          import plistlib, zipfile
          zpath=Path('dist/sculpt/Sculpt_DAW_0.4.0_Mac_Universal.zip')
          with zipfile.ZipFile(zpath) as z:
              paths=[p for p in z.namelist() if p.endswith('Sculpt DAW.app/Contents/Info.plist')]
              if len(paths)!=1:
                  raise SystemExit(f'Expected 1 Info.plist in signed ZIP, found {paths}')
              info=plistlib.loads(z.read(paths[0]))
              matches=[n for n in z.namelist() if n.endswith('Sculpt DAW.app/Contents/Resources/Sculpt DAW.icns')]
              assert len(matches)==1, 'Icon missing from signed app ZIP'
          assert info['CFBundleIdentifier']=='audio.sculpt.daw', info.get('CFBundleIdentifier')
          assert any(t.get('UTTypeIdentifier')=='audio.sculpt.daw.session' and 'scdaw' in t.get('UTTypeTagSpecification',{}).get('public.filename-extension',[]) for t in info.get('UTExportedTypeDeclarations',[])), info.get('UTExportedTypeDeclarations')
          assert any('audio.sculpt.daw.session' in t.get('LSItemContentTypes',[]) for t in info.get('CFBundleDocumentTypes',[])), info.get('CFBundleDocumentTypes')
          print('CORE17: signed ZIP, app icon, native UTI, .scdaw document type verified')
          PY_PLIST
      - name: Upload Sculpt DAW Core19 Mac (one artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Sculpt-DAW-Core19-Mac-Universal
          path: |
            dist/sculpt/Sculpt_DAW_0.4.0_Mac_Universal.zip
            dist/sculpt/Sculpt_DAW_0.4.0_Mac_Universal.zip.sha256
          if-no-files-found: error
          retention-days: 14
