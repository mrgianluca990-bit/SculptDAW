name: Sculpt DAW Core25 — workspace, Edit and bridge checks
on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sculpt-daw-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15-intel
    timeout-minutes: 120
    env:
      SCULPT_BRIDGE_VALIDATOR: /tmp/sculpt-bridge-validator
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: bridge-full-ci-v1
          cache-on-failure: "true"
      - name: Check out matching Show receiver for contract test
        uses: actions/checkout@v4
        with:
          repository: mrgianluca990-bit/Sculpt-Show
          ref: 962a43302c67ded1f72cc4bf130a66452211b5c6
          path: .bridge-show
          persist-credentials: false
      - name: Compile actual Swift Show receiver validator
        run: swiftc .bridge-show/Sources/SculptShowCore/*.swift bridge/tests/main.swift -o "$SCULPT_BRIDGE_VALIDATOR"
      - name: Format integrated sources
        run: cargo fmt --all
      - name: Check exact committed sources
        run: cargo check --locked -p sculpt-daw -p soundcraft-cli
      - name: DAW to Show audio and contract regression tests
        run: |
          cargo test --locked -p soundcraft-engine --lib sculpt_bridge
          cargo test --locked -p soundcraft-ui-egui --lib sculpt_bridge
      - name: Workspace and upstream regressions
        run: |
          cargo test --locked -p sculpt-daw single_instance
          cargo test --locked -p soundcraft-ui-egui --test sculpt_strip_height
          cargo test --locked -p soundcraft-mix --test master_insert_latency
          cargo test --locked -p soundcraft-vst3-host --test fixture_e2e host_set_controller_param_survives_state_round_trip
      - name: Full repository quality gate
        run: cargo xtask ci
      - name: Render Edit selected channel
        run: |
          mkdir -p dist/qa
          cargo run --locked -p soundcraft-ui-egui --example ui_shot -- dist/qa/edit.png QA/edit-strip.jsonl --size 1400x900
      - uses: actions/upload-artifact@v4
        with:
          name: Sculpt-DAW-Core25-Edit-preview
          path: dist/qa/edit.png
          if-no-files-found: error
      - name: Build universal app with embedded CLI
        run: bash sculpt/build-macos.sh
      - name: Verify archive
        run: |
          shasum -a 256 -c dist/sculpt/Sculpt_DAW_0.4.0_Mac_Universal.zip.sha256
          unzip -t dist/sculpt/Sculpt_DAW_0.4.0_Mac_Universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Sculpt-DAW-Bridge-${{ github.sha }}
          path: dist/sculpt/Sculpt_DAW_0.4.0_Mac_Universal.zip*
          if-no-files-found: error
          retention-days: 14
