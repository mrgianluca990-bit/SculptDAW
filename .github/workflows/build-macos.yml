name: Sculpt DAW — native checks and explicit packaging
on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop, 'feature/**']
  workflow_dispatch:
    inputs:
      package_archive:
        description: Build and verify the complete universal app after the quality gate
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: sculpt-daw-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      SCULPT_BRIDGE_VALIDATOR: /tmp/sculpt-bridge-validator
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: sculpt-native-arm64-gate-v2
          cache-on-failure: "true"
      - name: Record and check native build environment
        run: |
          mkdir -p dist/qa
          uname -a | tee dist/qa/environment.log
          sw_vers | tee -a dist/qa/environment.log
          rustc -Vv | tee -a dist/qa/environment.log
          test "$RUNNER_ARCH" = ARM64
      - name: Check out pinned Show receiver for contract tests
        uses: actions/checkout@v4
        with:
          repository: mrgianluca990-bit/Sculpt-Show
          ref: 962a43302c67ded1f72cc4bf130a66452211b5c6
          path: .bridge-show
          persist-credentials: false
      - name: Compile actual Swift Show receiver validator
        run: swiftc .bridge-show/Sources/SculptShowCore/*.swift bridge/tests/main.swift -o "$SCULPT_BRIDGE_VALIDATOR"
      - name: Format integrated sources
        run: cargo fmt --all
      - name: Full repository quality gate, including audio, I/O, plugin and bridge tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p dist/qa
          cargo xtask ci 2>&1 | tee dist/qa/quality-gate.log
      - name: Render release previews
        if: startsWith(github.ref, 'refs/heads/release/') || (github.event_name == 'workflow_dispatch' && inputs.package_archive)
        run: |
          cargo run --locked -p soundcraft-ui-egui --example ui_shot -- dist/qa/edit.png QA/edit-strip.jsonl --size 1400x900
          cargo run --locked -p soundcraft-ui-egui --example ui_shot -- dist/qa/playback-engine.png QA/playback-engine.jsonl --size 1400x1000
          cargo run --locked -p soundcraft-ui-egui --example ui_shot -- dist/qa/io-bus.png QA/io-setup.jsonl --size 1400x1000
      - name: Build universal app with embedded CLI
        if: startsWith(github.ref, 'refs/heads/release/') || (github.event_name == 'workflow_dispatch' && inputs.package_archive)
        run: bash sculpt/build-macos.sh
      - name: Verify archive
        if: startsWith(github.ref, 'refs/heads/release/') || (github.event_name == 'workflow_dispatch' && inputs.package_archive)
        run: |
          shasum -a 256 -c dist/sculpt/Sculpt_DAW_0.4.0_Mac_Universal.zip.sha256
          unzip -t dist/sculpt/Sculpt_DAW_0.4.0_Mac_Universal.zip
      - name: Upload complete app
        if: startsWith(github.ref, 'refs/heads/release/') || (github.event_name == 'workflow_dispatch' && inputs.package_archive)
        uses: actions/upload-artifact@v4
        with:
          name: Sculpt-DAW-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/sculpt/Sculpt_DAW_0.4.0_Mac_Universal.zip*
          if-no-files-found: error
          retention-days: 14
      - name: Retain quality gate log and available previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sculpt-DAW-checks-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/qa/
          if-no-files-found: warn
          retention-days: 14
