          assert 'send_options_menu(app, ui, id, slot, send);' in mix_src
          assert 'SCULPT_CORE14_METER_PARITY' in (ROOT / APP).read_text(encoding='utf8')
          assert 'SCULPT_CORE14_UPDATE_XFADE_OVERLAP' in engine_src
