      - name: Install Rust stable with both macOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Validate complete Sculpt editing sources compile
        shell: bash
        run: cargo check --locked --target x86_64-apple-darwin -p sculpt-daw

      - name: Run fade and crossfade regression tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --target x86_64-apple-darwin -p soundcraft-engine --lib fades_and_crossfades
          cargo test --locked --target x86_64-apple-darwin -p soundcraft-engine --lib sculpt_
          cargo test --locked --target x86_64-apple-darwin -p soundcraft-playback --lib

      - name: Verify selected fade deletion and undo semantics
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --target x86_64-apple-darwin -p soundcraft-engine --lib sculpt_selected_fade_delete
          cargo test --locked --target x86_64-apple-darwin -p soundcraft-engine --lib sculpt_selected_crossfade_delete
          cargo test --locked --target x86_64-apple-darwin -p soundcraft-ui-egui --test shortcuts

      - name: Build the universal app and CLI
        run: bash sculpt/build-macos.sh

      - name: Verify downloadable ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="dist/sculpt/Sculpt_DAW_0.4.0_Mac_Universal.zip"
          test -s "$ZIP"
          shasum -a 256 -c "$ZIP.sha256"
          unzip -t "$ZIP"
          unzip -l "$ZIP" | grep -F 'Sculpt DAW.app/Contents/MacOS/sculpt-daw'

      - name: Export verified source changes as a patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/sculpt
          git diff --binary -- apps/soundcraft/src/main.rs crates/ui-egui/src crates/engine/src/edit.rs crates/engine/src/cmd/edit.rs crates/playback/src/lib.rs > dist/sculpt/Sculpt_DAW_UI_Fades_Source.patch
          test -s dist/sculpt/Sculpt_DAW_UI_Fades_Source.patch || echo 'Source already integrated in GitHub.'

      - name: Upload Sculpt DAW app
        uses: actions/upload-artifact@v4
        with:
          name: Sculpt-DAW-Mac-Selectable-Fades-Pilot
          path: |
            dist/sculpt/Sculpt_DAW_0.4.0_Mac_Universal.zip
            dist/sculpt/Sculpt_DAW_0.4.0_Mac_Universal.zip.sha256
            dist/sculpt/Sculpt_DAW_UI_Fades_Source.patch
          if-no-files-found: error
          retention-days: 30

      # The same UI patches previously lived *only* in the workflow. Once the
      # whole binary and fade-engine regression tests pass, persist the modified
      # Rust sources. GITHUB_TOKEN pushes intentionally do not restart this job.
      - name: Persist verified Rust fixes to SculptDAW main
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git add apps/soundcraft/src/main.rs \
                  crates/ui-egui/src/lib.rs \
                  crates/ui-egui/src/panels.rs \
                  crates/ui-egui/src/mix_window.rs \
                  crates/ui-egui/src/edit_window.rs \
                  crates/ui-egui/src/toolbar.rs \
                  crates/ui-egui/src/shortcuts.rs \
                  crates/ui-egui/src/dialogs.rs \
                  crates/ui-egui/src/menus.rs \
                  crates/ui-egui/src/windows.rs \
                  crates/engine/src/edit.rs \
                  crates/engine/src/cmd/edit.rs \
                  crates/playback/src/lib.rs
          if git diff --cached --quiet; then
            echo 'No source changes to persist.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sculpt DAW: integrate UI Pilot and crossfade editing sources'
          git push origin HEAD:main
