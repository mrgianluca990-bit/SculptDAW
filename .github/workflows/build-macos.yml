name: Sculpt DAW - Core Plugins VST3 and AU QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sculpt-daw-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-core:
    name: Sculpt DAW Core (macOS Universal)
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - name: Checkout Sculpt DAW
        uses: actions/checkout@v4

      # Keep exact upstream provenance while the original upload remains incomplete.
      - name: Checkout pinned SoundCraft for missing source files
        uses: actions/checkout@v4
        with:
          repository: storytold/soundcraft
          ref: 6cf896e76c0ec82a11bf2494f209cfe7c8507f74
          path: soundcraft-upstream
          persist-credentials: false

      - name: Restore missing Rust source files without overwriting Sculpt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p crates/dsp/src xtask/src
          rsync -a --ignore-existing soundcraft-upstream/crates/dsp/src/ crates/dsp/src/
          if [ ! -f xtask/src/main.rs ]; then cp soundcraft-upstream/xtask/src/main.rs xtask/src/main.rs; fi
          test -s crates/dsp/src/lib.rs
          test -s xtask/src/main.rs

      - name: Install Sculpt Core QA menu (do not remove underlying commands)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYSCULPTCORE'
          #!/usr/bin/env python3
          """Install the small Sculpt Core menu surface; preserve the engine and commands."""
          from pathlib import Path
          CORE_MENU = "# Sculpt DAW Core — limited, testable feature surface (v0.1)\n# Add ONE validated menu path at a time, AFTER successful real-world testing.\n# These entries are test candidates, not an assertion that all functions are approved.\nFile > New...\nFile > Open > Session...\nFile > Close Session\nFile > Save Session\nFile > Save Session As...\nFile > Import > Audio...\nEdit > Can't Undo\nEdit > Can't Redo\nEdit > Cut\nEdit > Copy\nEdit > Paste\nEdit > Clear\nEdit > Separate > At Selection\nEdit > Fades > Create...\nEdit > Fades > Delete\nTrack > New...\nTrack > Delete\nView > Mix Window Views > Inserts A-E\nView > Mix Window Views > Sends A-E\nView > Mix Window Views > I/O\nView > Edit Window Views > Inserts A-E\nView > Edit Window Views > I/O\nWindow > Edit\nWindow > Mix\nWindow > Transport\n"
          
          path = Path('sculpt/qa-core-menu.txt')
          path.parent.mkdir(parents=True, exist_ok=True)
          if not path.exists():
              path.write_text(CORE_MENU, encoding='utf-8')
          
          src = Path('crates/ui-egui/src/menus.rs')
          code = src.read_text(encoding='utf-8')
          marker = '// SCULPT_CORE_MENU_V1'
          if marker not in code:
              original = 'pub fn tree() -> Vec<MenuNode> {\n    let mut roots: Vec<MenuNode> = Vec::new();\n    for line in catalog::catalog() {\n        insert_path(&mut roots, line);\n    }\n    insert_path(&mut roots, "Window > Reset Panel Layout");\n    for (path, _) in MENU_WINDOWS {\n        insert_path(&mut roots, path);\n    }\n    roots\n}\n'
              replacement = '// SCULPT_CORE_MENU_V1: small, explicit QA surface; full SoundCraft commands stay in the engine.\n// To promote a feature, edit ONLY sculpt/qa-core-menu.txt after real-world testing.\nconst SCULPT_CORE_MENU: &str = include_str!("../../../sculpt/qa-core-menu.txt");\n\npub fn tree() -> Vec<MenuNode> {\n    let mut roots: Vec<MenuNode> = Vec::new();\n    for line in SCULPT_CORE_MENU.lines().map(str::trim)\n        .filter(|line| !line.is_empty() && !line.starts_with(\'#\'))\n    {\n        insert_path(&mut roots, line);\n    }\n    roots\n}\n\n#[cfg(test)]\nmod sculpt_core_menu_tests {\n    use super::*;\n\n    #[test]\n    fn only_explicit_core_items_are_displayed() {\n        let allowed: Vec<&str> = SCULPT_CORE_MENU.lines().map(str::trim)\n            .filter(|p| !p.is_empty() && !p.starts_with(\'#\')).collect();\n        assert!((12..=45).contains(&allowed.len()), "keep the core UI intentionally small");\n        assert!(allowed.iter().all(|p| catalog::catalog().iter().any(|s| s == p)),\n            "every core entry must exist in the original menu catalog");\n        fn leaves(nodes: &[MenuNode], out: &mut Vec<String>) {\n            for node in nodes {\n                if node.children.is_empty() { out.push(node.path.clone()); }\n                else { leaves(&node.children, out); }\n            }\n        }\n        let mut actual = Vec::new();\n        leaves(&tree(), &mut actual);\n        assert_eq!(actual.len(), allowed.len());\n        for path in allowed { assert!(actual.iter().any(|s| s == path), "missing: {path}"); }\n        assert!(!actual.iter().any(|s| s.starts_with("AudioSuite >")));\n        assert!(!actual.iter().any(|s| s.starts_with("Event >")));\n        assert!(!actual.iter().any(|s| s.starts_with("Setup >")));\n    }\n}\n'
              if code.count(original) != 1:
                  raise SystemExit('Unexpected menus.rs tree layout: refusing risky source changes')
              code = code.replace(original, replacement, 1)
          # Keep the fallback egui menu branded correctly (native menu already says Sculpt DAW).
          code = code.replace('ui.menu_button("SoundCraft", |ui| {', 'ui.menu_button("Sculpt DAW", |ui| {')
          code = code.replace('ui.button("About SoundCraft")', 'ui.button("About Sculpt DAW")')
          src.write_text(code, encoding='utf-8')
          native = Path('apps/soundcraft/src/native_menu.rs')
          if native.exists():
              source = native.read_text(encoding='utf-8')
              source = '\n'.join(line for line in source.split('\n')
                  if 'native.add_item(app, &app_menu, \"Session Info\",' not in line
                  and 'native.add_item(app, &app_menu, \"Session Audio Health\",' not in line)
              native.write_text(source, encoding='utf-8')
          
          fallback = src.read_text(encoding='utf-8')
          for fragment in [
              '                    if ui.button(\"Session Info\").clicked() {\n                        app.ui.show_session_info = true;\n                    }\n',
              '                    if ui.button(\"Session Audio Health\").clicked() {\n                        let _ = app.run(\"window.audio_health\", json!({\"value\": true}));\n                    }\n',
          ]:
              fallback = fallback.replace(fragment, '')
          src.write_text(fallback, encoding='utf-8')
          print('Sculpt Core menu:', len([s for s in CORE_MENU.splitlines() if s and not s.startswith('#')]), 'entries')
          PYSCULPTCORE
          git diff --stat

      - name: Limit visible plugins to VST3 and Audio Units
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYSCULPTPLUGINS'
          #!/usr/bin/env python3
          """Sculpt DAW Core: expose VST3 and Audio Units only in plugin pickers.
          No destructive DSP/legacy session changes. Re-runnable.
          """
          from pathlib import Path


          def replace_between(path, begin, end, replacement):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(begin) != 1:
                  raise RuntimeError(f'{path}: expected 1 BEGIN anchor, found {text.count(begin)}: {begin[:100]!r}')
              pos = text.index(begin)
              if text.count(end, pos + len(begin)) < 1:
                  raise RuntimeError(f'{path}: missing END anchor: {end[:100]!r}')
              last = text.index(end, pos + len(begin))
              p.write_text(text[:pos] + replacement + text[last:], encoding='utf-8')


          mix = Path('crates/ui-egui/src/mix_window.rs')
          code = mix.read_text(encoding='utf-8')
          marker = '// SCULPT_CORE_VST3_AU_ONLY_V1'
          if marker not in code:
              replace_between(str(mix),
                  '    let mut cats: Vec<soundcraft_dsp::Category> = Vec::new();\n',
                  '    if let Some(plugin) = hosted_menus(ui, false) {\n',
                  '    // SCULPT_CORE_VST3_AU_ONLY_V1: limited, auditable native-plugin interface.\n'
                  '    // Built-in DSP remains compiled to preserve legacy project files.\n'
                  '    ui.label("Effects · VST3 / Audio Units");\n')
              replace_between(str(mix),
                  '    ui.menu_button("Built-in", |ui| {\n',
                  '    if let Some(p) = hosted_menus(ui, true) {\n',
                  '    ui.label("Instruments · VST3 / Audio Units");\n')
              replace_between(str(mix),
                  '    ui.menu_button("CLAP", |ui| {\n',
                  '    ui.menu_button("VST3", |ui| {\n',
                  '')
              code = mix.read_text(encoding='utf-8')
              assert marker in code
              assert 'ui.menu_button("CLAP", |ui| {' not in code
              assert 'ui.menu_button("Built-in", |ui| {' not in code
              print('Sculpt Core: only VST3 and AU in Edit/Mix plugin pickers')
          else:
              print('Sculpt Core plugin picker already updated; skipping')

          panels = Path('crates/ui-egui/src/panels.rs')
          text = panels.read_text(encoding='utf-8')
          old = '        let native_editor = soundcraft_mix::is_third_party(&ins.plugin);'
          new = ('        // VST3 exposes a native editor; Audio Units currently use generic controls.\n'
                 '        // Do not wait two seconds for an AU native editor which is not implemented.\n'
                 '        let native_editor = ins.plugin.starts_with("vst3:");')
          if old in text:
              assert text.count(old) == 1
              text = text.replace(old, new, 1)
          elif 'let native_editor = ins.plugin.starts_with("vst3:");' not in text:
              raise RuntimeError('Unexpected plugin editor flow')
          old = '                    if soundcraft_mix::is_third_party(&ins.plugin) {'
          if old in text:
              assert text.count(old) == 1
              text = text.replace(old, '                    if native_editor {', 1)
          elif '                    if native_editor {' not in text:
              raise RuntimeError('Unexpected native editor button flow')
          panels.write_text(text, encoding='utf-8')

          # Regression guard for the visible plugin picker; actual audio-host tests run in Actions.
          code = mix.read_text(encoding='utf-8')
          a = code.index('fn hosted_menus(')
          b = code.index('fn vendor_menus(', a)
          hosted = code[a:b]
          assert 'ui.menu_button("VST3", |ui|' in hosted
          assert 'ui.menu_button("Audio Units", |ui|' in hosted
          assert 'ui.menu_button("CLAP", |ui|' not in hosted
          assert 'soundcraft_dsp::plugins()' not in code[code.index('pub fn plugin_menu('):b]

          if 'mod sculpt_plugin_core_tests {' not in code:
              code += '''
          #[cfg(test)]
          mod sculpt_plugin_core_tests {
              // Checks that the GUI won't regress into the legacy broad plugin picker.
              // VST3 & AU hosts are tested separately with real fixture/system plugins.
              #[test]
              fn only_vst3_and_audio_units_are_visible() {
                  let src = include_str!("mix_window.rs");
                  let menu = &src[src.find("pub fn plugin_menu(").unwrap()..src.find("fn vendor_menus(").unwrap()];
                  let hosted = &src[src.find("fn hosted_menus(").unwrap()..src.find("fn vendor_menus(").unwrap()];
                  assert!(hosted.contains("menu_button(\\\"VST3\\\""));
                  assert!(hosted.contains("menu_button(\\\"Audio Units\\\""));
                  assert!(!hosted.contains("menu_button(\\\"CLAP\\\""));
                  assert!(!menu.contains("soundcraft_dsp::plugins()"));
                  assert!(!menu.contains("menu_button(\\\"Built-in\\\""));
                  assert!(menu.contains("mix.insert_bypass"));
                  assert!(menu.contains("mix.insert_remove"));
              }
          }
          '''
              mix.write_text(code, encoding='utf-8')
          print('Sculpt Core: AU generic UI available immediately, VST3 native editor unchanged')
          PYSCULPTPLUGINS
          git diff --stat

      - name: Install Rust for Apple Silicon and Intel
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Validate Core UI and test menu allowlist
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --target x86_64-apple-darwin -p sculpt-daw
          cargo test --locked --target x86_64-apple-darwin -p soundcraft-ui-egui --lib sculpt_core_menu_tests
          cargo test --locked --target x86_64-apple-darwin -p soundcraft-ui-egui --test shortcuts

      - name: Verify VST3 and Audio Units only, and test both plugin hosts
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --target x86_64-apple-darwin -p soundcraft-ui-egui --lib sculpt_plugin_core_tests
          # A genuine, instrumented VST3 fixture is scanned, instantiated and processes audio.
          cargo test --locked --target x86_64-apple-darwin -p soundcraft-vst3-host --test fixture_e2e
          # Apple's Audio Units exercise discovery, DSP processing, state round-trip and MIDI.
          cargo test --locked --target x86_64-apple-darwin -p soundcraft-au-host --test system_units
          cargo test --locked --target x86_64-apple-darwin -p soundcraft-engine --lib audio_units_insert_by_id

      - name: Validate working fade and playback engine regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --target x86_64-apple-darwin -p soundcraft-engine --lib sculpt_
          cargo test --locked --target x86_64-apple-darwin -p soundcraft-playback --lib

      - name: Build universal Mac application
        run: bash sculpt/build-macos.sh

      - name: Verify application archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          ZIP=dist/sculpt/Sculpt_DAW_0.4.0_Mac_Universal.zip
          test -s "$ZIP"
          shasum -a 256 -c "$ZIP.sha256"
          unzip -t "$ZIP" >/dev/null
          unzip -l "$ZIP" | grep -F 'Sculpt DAW.app/Contents/MacOS/sculpt-daw'

      - name: Upload tested app
        uses: actions/upload-artifact@v4
        with:
          name: Sculpt-DAW-Core-VST3-AU-Mac
          path: |
            dist/sculpt/Sculpt_DAW_0.4.0_Mac_Universal.zip
            dist/sculpt/Sculpt_DAW_0.4.0_Mac_Universal.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Permanently save simple Core menu sources (after successful compile)
        if: success()
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          git add crates/ui-egui/src/menus.rs crates/ui-egui/src/mix_window.rs crates/ui-egui/src/panels.rs apps/soundcraft/src/native_menu.rs sculpt/qa-core-menu.txt
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sculpt DAW: QA Core menu and VST3/AU-only plugin selection'
          git push origin HEAD:main
