      - name: Sculpt Core 15 - Targeted SoundCraft 0.7 trim fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYSCULPT15'
          from pathlib import Path
          # SoundCraft v0.7.0 PR #379: sorted clip order after Trim to Selection.
          path = Path('crates/engine/src/edit.rs')
          src = path.read_text(encoding='utf-8')
          marker = 'SCULPT_CORE15_UPSTREAM_070_TRIM_ORDER'
          if marker not in src:
              first = src.index('pub fn trim_to(s: &mut Session')
              last = src.index('/// Trim the start', first)
              region = src[first:last]
              old = '    n\n}\n'
              if region.count(old) != 1:
                  raise RuntimeError('Unexpected trim_to implementation; fail safely')
              new = '    // '+marker+': retain chronological order.\n    pl.sort();\n    n\n}\n'
              src = src[:first] + region.replace(old, new, 1) + src[last:]
          test_name = 'sculpt_core15_trim_keeps_chronological_order'
          if test_name not in src:
              where = '    #[test]\n    fn sculpt_core_group_move_keeps_crossfade() {'
              test = '''    #[test]
              fn sculpt_core15_trim_keeps_chronological_order() {
                  let (mut s, t) = session_with_clip();
                  let second = s.new_clip_id();
                  if let Some(pl) = s.track_mut(t).and_then(|t| t.playlist_mut()) {
                      pl.clips.push(Clip::audio(second, "earlier", SourceId(500), 0, 500, 2000));
                  }
                  let _ = trim_to(&mut s, t, Range::new(100, 8000));
                  let list = s.track(t).unwrap().clips();
                  assert_eq!(list.len(), 2);
                  assert!(list.windows(2).all(|w| w[0].start <= w[1].start));
              }
          
          '''
              if src.count(where) != 1:
                  raise RuntimeError('Cannot find expected engine test suite')
              src = src.replace(where, test + where, 1)
          path.write_text(src, encoding='utf-8')
          assert marker in src and test_name in src
          print('SoundCraft 0.7.0 safe clip-sort fix + test installed')
          PYSCULPT15
          git diff --stat

