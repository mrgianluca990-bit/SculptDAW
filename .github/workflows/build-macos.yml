name: Sculpt DAW Core 15 - Consolidated REAPER Logic SoundCraft 0.7 Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sculpt-daw-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-core:
    name: Sculpt DAW Core (macOS Universal)
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - name: Checkout Sculpt DAW
        uses: actions/checkout@v4

      # Keep exact upstream provenance while the original upload remains incomplete.
      - name: Checkout pinned SoundCraft for missing source files
        uses: actions/checkout@v4
        with:
          repository: storytold/soundcraft
          ref: 6cf896e76c0ec82a11bf2494f209cfe7c8507f74
          path: soundcraft-upstream
          persist-credentials: false

      - name: Restore missing Rust source files without overwriting Sculpt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p crates/dsp/src xtask/src
          rsync -a --ignore-existing soundcraft-upstream/crates/dsp/src/ crates/dsp/src/
          if [ ! -f xtask/src/main.rs ]; then cp soundcraft-upstream/xtask/src/main.rs xtask/src/main.rs; fi
          test -s crates/dsp/src/lib.rs
          test -s xtask/src/main.rs

      - name: Install Sculpt Core QA menu (do not remove underlying commands)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYSCULPTCORE'
          #!/usr/bin/env python3
          """Install the small Sculpt Core menu surface; preserve the engine and commands."""
          from pathlib import Path
          CORE_MENU = "# Sculpt DAW Core — limited, testable feature surface (v0.1)\n# Add ONE validated menu path at a time, AFTER successful real-world testing.\n# These entries are test candidates, not an assertion that all functions are approved.\nFile > New...\nFile > Open > Session...\nFile > Close Session\nFile > Save Session\nFile > Save Session As...\nFile > Import > Audio...\nEdit > Can't Undo\nEdit > Can't Redo\nEdit > Cut\nEdit > Copy\nEdit > Paste\nEdit > Clear\nEdit > Separate > At Selection\nEdit > Fades > Create...\nEdit > Fades > Delete\nTrack > New...\nTrack > Delete\nView > Mix Window Views > Inserts A-E\nView > Mix Window Views > Sends A-E\nView > Mix Window Views > I/O\nView > Edit Window Views > Inserts A-E\nView > Edit Window Views > I/O\nWindow > Edit\nWindow > Mix\nWindow > Transport\n"
          
          path = Path('sculpt/qa-core-menu.txt')
          path.parent.mkdir(parents=True, exist_ok=True)
          if not path.exists():
              path.write_text(CORE_MENU, encoding='utf-8')
          
          src = Path('crates/ui-egui/src/menus.rs')
          code = src.read_text(encoding='utf-8')
          marker = '// SCULPT_CORE_MENU_V1'
          if marker not in code:
              original = 'pub fn tree() -> Vec<MenuNode> {\n    let mut roots: Vec<MenuNode> = Vec::new();\n    for line in catalog::catalog() {\n        insert_path(&mut roots, line);\n    }\n    insert_path(&mut roots, "Window > Reset Panel Layout");\n    for (path, _) in MENU_WINDOWS {\n        insert_path(&mut roots, path);\n    }\n    roots\n}\n'
              replacement = '// SCULPT_CORE_MENU_V1: small, explicit QA surface; full SoundCraft commands stay in the engine.\n// To promote a feature, edit ONLY sculpt/qa-core-menu.txt after real-world testing.\nconst SCULPT_CORE_MENU: &str = include_str!("../../../sculpt/qa-core-menu.txt");\n\npub fn tree() -> Vec<MenuNode> {\n    let mut roots: Vec<MenuNode> = Vec::new();\n    for line in SCULPT_CORE_MENU.lines().map(str::trim)\n        .filter(|line| !line.is_empty() && !line.starts_with(\'#\'))\n    {\n        insert_path(&mut roots, line);\n    }\n    roots\n}\n\n#[cfg(test)]\nmod sculpt_core_menu_tests {\n    use super::*;\n\n    #[test]\n    fn only_explicit_core_items_are_displayed() {\n        let allowed: Vec<&str> = SCULPT_CORE_MENU.lines().map(str::trim)\n            .filter(|p| !p.is_empty() && !p.starts_with(\'#\')).collect();\n        assert!((12..=45).contains(&allowed.len()), "keep the core UI intentionally small");\n        assert!(allowed.iter().all(|p| catalog::catalog().iter().any(|s| s == p)),\n            "every core entry must exist in the original menu catalog");\n        fn leaves(nodes: &[MenuNode], out: &mut Vec<String>) {\n            for node in nodes {\n                if node.children.is_empty() { out.push(node.path.clone()); }\n                else { leaves(&node.children, out); }\n            }\n        }\n        let mut actual = Vec::new();\n        leaves(&tree(), &mut actual);\n        assert_eq!(actual.len(), allowed.len());\n        for path in allowed { assert!(actual.iter().any(|s| s == path), "missing: {path}"); }\n        assert!(!actual.iter().any(|s| s.starts_with("AudioSuite >")));\n        assert!(!actual.iter().any(|s| s.starts_with("Event >")));\n        assert!(!actual.iter().any(|s| s.starts_with("Setup >")));\n    }\n}\n'
              if code.count(original) != 1:
                  raise SystemExit('Unexpected menus.rs tree layout: refusing risky source changes')
              code = code.replace(original, replacement, 1)
          # Keep the fallback egui menu branded correctly (native menu already says Sculpt DAW).
          code = code.replace('ui.menu_button("SoundCraft", |ui| {', 'ui.menu_button("Sculpt DAW", |ui| {')
          code = code.replace('ui.button("About SoundCraft")', 'ui.button("About Sculpt DAW")')
          src.write_text(code, encoding='utf-8')
          native = Path('apps/soundcraft/src/native_menu.rs')
          if native.exists():
              source = native.read_text(encoding='utf-8')
              source = '\n'.join(line for line in source.split('\n')
                  if 'native.add_item(app, &app_menu, \"Session Info\",' not in line
                  and 'native.add_item(app, &app_menu, \"Session Audio Health\",' not in line)
              native.write_text(source, encoding='utf-8')
          
          fallback = src.read_text(encoding='utf-8')
          for fragment in [
              '                    if ui.button(\"Session Info\").clicked() {\n                        app.ui.show_session_info = true;\n                    }\n',
              '                    if ui.button(\"Session Audio Health\").clicked() {\n                        let _ = app.run(\"window.audio_health\", json!({\"value\": true}));\n                    }\n',
          ]:
              fallback = fallback.replace(fragment, '')
          src.write_text(fallback, encoding='utf-8')
          print('Sculpt Core menu:', len([s for s in CORE_MENU.splitlines() if s and not s.startswith('#')]), 'entries')
          PYSCULPTCORE
          git diff --stat

      - name: Limit visible plugins to VST3 and Audio Units
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYSCULPTPLUGINS'
          #!/usr/bin/env python3
          """Sculpt DAW Core: expose VST3 and Audio Units only in plugin pickers.
          No destructive DSP/legacy session changes. Re-runnable.
          """
          from pathlib import Path


          def replace_between(path, begin, end, replacement):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(begin) != 1:
                  raise RuntimeError(f'{path}: expected 1 BEGIN anchor, found {text.count(begin)}: {begin[:100]!r}')
              pos = text.index(begin)
              if text.count(end, pos + len(begin)) < 1:
                  raise RuntimeError(f'{path}: missing END anchor: {end[:100]!r}')
              last = text.index(end, pos + len(begin))
              p.write_text(text[:pos] + replacement + text[last:], encoding='utf-8')


          mix = Path('crates/ui-egui/src/mix_window.rs')
          code = mix.read_text(encoding='utf-8')
          marker = '// SCULPT_CORE_VST3_AU_ONLY_V1'
          if marker not in code:
              replace_between(str(mix),
                  '    let mut cats: Vec<soundcraft_dsp::Category> = Vec::new();\n',
                  '    if let Some(plugin) = hosted_menus(ui, false) {\n',
                  '    // SCULPT_CORE_VST3_AU_ONLY_V1: limited, auditable native-plugin interface.\n'
                  '    // Built-in DSP remains compiled to preserve legacy project files.\n'
                  '    ui.label("Effects · VST3 / Audio Units");\n')
              replace_between(str(mix),
                  '    ui.menu_button("Built-in", |ui| {\n',
                  '    if let Some(p) = hosted_menus(ui, true) {\n',
                  '    ui.label("Instruments · VST3 / Audio Units");\n')
              replace_between(str(mix),
                  '    ui.menu_button("CLAP", |ui| {\n',
                  '    ui.menu_button("VST3", |ui| {\n',
                  '')
              code = mix.read_text(encoding='utf-8')
              assert marker in code
              assert 'ui.menu_button("CLAP", |ui| {' not in code
              assert 'ui.menu_button("Built-in", |ui| {' not in code
              print('Sculpt Core: only VST3 and AU in Edit/Mix plugin pickers')
          else:
              print('Sculpt Core plugin picker already updated; skipping')

          panels = Path('crates/ui-egui/src/panels.rs')
          text = panels.read_text(encoding='utf-8')
          old = '        let native_editor = soundcraft_mix::is_third_party(&ins.plugin);'
          new = ('        // VST3 exposes a native editor; Audio Units currently use generic controls.\n'
                 '        // Do not wait two seconds for an AU native editor which is not implemented.\n'
                 '        let native_editor = ins.plugin.starts_with("vst3:");')
          if old in text:
              assert text.count(old) == 1
              text = text.replace(old, new, 1)
          elif 'let native_editor = ins.plugin.starts_with("vst3:");' not in text:
              raise RuntimeError('Unexpected plugin editor flow')
          old = '                    if soundcraft_mix::is_third_party(&ins.plugin) {'
          if old in text:
              assert text.count(old) == 1
              text = text.replace(old, '                    if native_editor {', 1)
          elif '                    if native_editor {' not in text:
              raise RuntimeError('Unexpected native editor button flow')
          panels.write_text(text, encoding='utf-8')

          # Regression guard for the visible plugin picker; actual audio-host tests run in Actions.
          code = mix.read_text(encoding='utf-8')
          a = code.index('fn hosted_menus(')
          b = code.index('fn vendor_menus(', a)
          hosted = code[a:b]
          assert 'ui.menu_button("VST3", |ui|' in hosted
          assert 'ui.menu_button("Audio Units", |ui|' in hosted
          assert 'ui.menu_button("CLAP", |ui|' not in hosted
          assert 'soundcraft_dsp::plugins()' not in code[code.index('pub fn plugin_menu('):b]

          if 'mod sculpt_plugin_core_tests {' not in code:
              code += '''
          #[cfg(test)]
          mod sculpt_plugin_core_tests {
              // Checks that the GUI won't regress into the legacy broad plugin picker.
              // VST3 & AU hosts are tested separately with real fixture/system plugins.
              #[test]
              fn only_vst3_and_audio_units_are_visible() {
                  let src = include_str!("mix_window.rs");
                  let menu = &src[src.find("pub fn plugin_menu(").unwrap()..src.find("fn vendor_menus(").unwrap()];
                  let hosted = &src[src.find("fn hosted_menus(").unwrap()..src.find("fn vendor_menus(").unwrap()];
                  assert!(hosted.contains("menu_button(\\\"VST3\\\""));
                  assert!(hosted.contains("menu_button(\\\"Audio Units\\\""));
                  assert!(!hosted.contains("menu_button(\\\"CLAP\\\""));
                  assert!(!menu.contains("soundcraft_dsp::plugins()"));
                  assert!(!menu.contains("menu_button(\\\"Built-in\\\""));
                  assert!(menu.contains("mix.insert_bypass"));
                  assert!(menu.contains("mix.insert_remove"));
              }
          }
          '''
              mix.write_text(code, encoding='utf-8')
          print('Sculpt Core: AU generic UI available immediately, VST3 native editor unchanged')
          PYSCULPTPLUGINS
          git diff --stat

      - name: Patch Sculpt Core 13 - eight slots, fades, crossfade moves, Return, session and exit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYSCULPT13'
          #!/usr/bin/env python3
          """Conservative fixes for Sculpt DAW Core #13. Applied to the checked-out source in GitHub Actions.
          No new Show code, format migrations, plugin format changes or deletions of stable features.
          """
          from pathlib import Path

          def file(p): return Path(p)

          def change(p, old, new, count=1, already=None):
              f=file(p); t=f.read_text(encoding='utf-8')
              if already is not None and already in t: return False
              n=t.count(old)
              if n != count: raise RuntimeError(f'{p}: expected {count} occurrences, found {n}, anchor={old[:120]!r}')
              f.write_text(t.replace(old,new,count), encoding='utf-8')
              print(f'updated {p}'); return True

          MENU='sculpt/qa-core-menu.txt'
          s=file(MENU).read_text()
          for entry in ['View > Mix Window Views > Inserts F-J','View > Mix Window Views > Sends F-J',
                        'View > Edit Window Views > Inserts F-J','View > Edit Window Views > Sends A-E',
                        'View > Edit Window Views > Sends F-J']:
              if entry not in s:
                  tag= 'View > Mix Window Views > I/O' if 'Mix Window' in entry else 'View > Edit Window Views > I/O'
                  if tag not in s: raise RuntimeError('missing menu insertion point '+tag)
                  s=s.replace(tag,entry+'\n'+tag,1)
          file(MENU).write_text(s)

          # Preserve original command IDs/paths while labeling the actual last three slots F-H.
          MENUS='crates/ui-egui/src/menus.rs'
          change(MENUS,
                 '    let label = live_label(app, id.as_deref()).unwrap_or_else(|| n.label.clone());',
                 '    let label = live_label(app, id.as_deref()).unwrap_or_else(|| match n.label.as_str() {\n'
                 '        "Inserts F-J" => "Inserts F-H".to_string(),\n'
                 '        "Sends F-J" => "Sends F-H".to_string(),\n'
                 '        _ => n.label.clone(),\n'
                 '    });'.replace("\\n", "\n"),
                 already='"Inserts F-J" => "Inserts F-H".to_string()')
          NATIVE='apps/soundcraft/src/native_menu.rs'
          change(NATIVE,
                 '        let item = CheckMenuItem::new(label, enabled, checked, None);',
                 '        let display = match label { "Inserts F-J" => "Inserts F-H", "Sends F-J" => "Sends F-H", _ => label };\n'
                 '        let item = CheckMenuItem::new(display, enabled, checked, None);'.replace("\\n", "\n"),
                 already='let display = match label { "Inserts F-J"')

          MIX='crates/ui-egui/src/mix_window.rs'
          change(MIX,'''        ("inserts_fj", "INSERTS F-J", 5, false),''','''        ("inserts_fj", "INSERTS F-H", 5, false),''',already='("inserts_fj", "INSERTS F-H", 5, false)')
          change(MIX,'''        ("sends_fj", "SENDS F-J", 5, true),''','''        ("sends_fj", "SENDS F-H", 5, true),''',already='("sends_fj", "SENDS F-H", 5, true)')
          change(MIX,'''        let sec = Rect::from_min_size(pos2(x0, y), vec2(inner_w, 16.0 + 5.0 * 17.0));
                  ui.painter().rect_filled(sec, 2.0, t.strip_section);
                  section_label(ui, sec, title);
                  for k in 0..5 {''','''        // SCULPT_CORE_EIGHT_SLOTS_V1: groups A-E (5) + F-H (3) = 8, never display I/J.
                  let visible = if off == 5 { 3usize } else { 5usize };
                  let sec = Rect::from_min_size(pos2(x0, y), vec2(inner_w, 16.0 + visible as f32 * 17.0));
                  ui.painter().rect_filled(sec, 2.0, t.strip_section);
                  section_label(ui, sec, title);
                  for k in 0..visible {''',already='SCULPT_CORE_EIGHT_SLOTS_V1')

          EDIT='crates/ui-egui/src/edit_window.rs'
          # Also display only three slots in the Edit-view F-H columns.
          change(EDIT,'''            for i in 0..5.min(rows) {''','''            for i in 0..(if off == 5 { 3 } else { 5 }).min(rows) {''',count=2,already='for i in 0..(if off == 5 { 3 } else { 5 }).min(rows) {')
          # Click anywhere inside a single fade's bounded region, not within 11 px of the curve.
          change(EDIT,'''            if (p.y - y).abs() <= 11.0 {''','''            // SCULPT_CORE_FADE_HIT_V1: full area of the fade, instead of the thin curve.
                      if p.y >= top && p.y <= lane.max.y {''',count=2,already='SCULPT_CORE_FADE_HIT_V1')
          # Avoid rendering two *independent* fades beneath one crossfade. Crossfade has its own overlay.
          s=file(EDIT).read_text()
          if 'SCULPT_CORE_XFADE_SINGLE_OVERLAY_V1' not in s:
              needle='''    // Sculpt: fades must stay legible against waveforms, even without selecting the clip.'''
              if s.count(needle)!=1: raise RuntimeError('no fade painter anchor')
              insert='''    // SCULPT_CORE_XFADE_SINGLE_OVERLAY_V1: a crossfade is drawn only by sculpt_draw_crossfades.
              // Prevent the same two envelopes from also looking like independent corner fades.
              let crossfade_in = track.clips().windows(2).any(|p| p[1].id == clip.id && p[0].end() > p[1].start
                  && p[0].fade_out.len > 0 && p[1].fade_in.len > 0);
              let crossfade_out = track.clips().windows(2).any(|p| p[0].id == clip.id && p[0].end() > p[1].start
                  && p[0].fade_out.len > 0 && p[1].fade_in.len > 0);
          '''
              s=s.replace(needle, insert+needle,1)
              # Restrict rendering code inside draw_clip only, between anchor and next paint block.
              i=s.index('    // SCULPT_CORE_XFADE_SINGLE_OVERLAY_V1')
              j=s.index('fn sculpt_fade_at_pointer(',i)
              v=s[i:j]
              # these conditions appear twice (shade/curve), replace all in visual block.
              if v.count('if clip.fade_in.len > 0 {')<1 or v.count('if clip.fade_out.len > 0 {')<1:
                  raise RuntimeError('expected standalone fade draw conditions')
              v=v.replace('if clip.fade_in.len > 0 {','if clip.fade_in.len > 0 && !crossfade_in {')
              v=v.replace('if clip.fade_out.len > 0 {','if clip.fade_out.len > 0 && !crossfade_out {')
              s=s[:i]+v+s[j:]
              file(EDIT).write_text(s)
          # Reduce extra crossfade text that clutters the edit timeline.
          s=file(EDIT).read_text()
          if 'SCULPT_CORE_XFADE_PAINT_V1' not in s:
              old='''        painter.rect_filled(area, 0.0, Color32::from_rgba_unmultiplied(234, 199, 116, 45));'''
              new='''        // SCULPT_CORE_XFADE_PAINT_V1: subtle overlap with two distinguishable envelopes.
                  painter.rect_filled(area, 0.0, Color32::from_rgba_unmultiplied(210, 215, 220, 26));'''
              if s.count(old)!=1:raise RuntimeError('crossfade painter anchor changed')
              s=s.replace(old,new,1)
              # Remove X-FADE label: highlighted region and two curves provide feedback.
              a='''        if x1 - x0 > 45.0 && area.height() > 35.0 {
                      painter.text(pos2(area.center().x, area.min.y + 9.0), Align2::CENTER_CENTER, if chosen { "X-FADE SELECTED" } else { "X-FADE" }, bold(9.0), Color32::WHITE);
                  }
          '''
              if s.count(a)!=1:raise RuntimeError('crossfade label not found')
              s=s.replace(a,'',1)
              file(EDIT).write_text(s)

          SHORT='crates/ui-egui/src/shortcuts.rs'
          change(SHORT,'''        Key::Enter if plain => {
                      let _ = app.run("markers.add", json!({}));
                      true
                  }''','''        // SCULPT_CORE_MAC_RETURN_RTZ_V1: Return is Return-to-Zero, not Add Marker.
                  Key::Enter if plain => {
                      let _ = app.run("transport.rtz", json!({}));
                      true
                  }''', already='SCULPT_CORE_MAC_RETURN_RTZ_V1')

          # Make the default UI show the second group, without overwriting manual view preferences.
          MAIN='apps/soundcraft/src/main.rs'
          change(MAIN,'''            app.ui = prefs;
                      if let Some(port) = control_port {''','''            app.ui = prefs;
                      // SCULPT_CORE_EIGHT_SLOTS_DEFAULT_V1: ensure F-H is available in Mix by default.
                      // Existing A-E toggles and custom UI preferences remain intact.
                      for (first, second) in [("inserts_ae", "inserts_fj"), ("sends_ae", "sends_fj")] {
                          if app.ui.mix_views.iter().any(|k| k == first) && !app.ui.mix_views.iter().any(|k| k == second) {
                              app.ui.mix_views.push(second.to_string());
                          }
                      }
                      if let Some(port) = control_port {''',already='SCULPT_CORE_EIGHT_SLOTS_DEFAULT_V1')
          # Add just the extra Edit columns as options, don't force them on cramped track headers.
          # Mac Touch Bar/AppKit KVO workaround already developed but NOT present in builds #11/#12.
          change(MAIN,'''    let mut options = eframe::NativeOptions {
          ''','''    let mut options = eframe::NativeOptions {
                  // SCULPT_MAC_TOUCHBAR_EXIT_PILOT_V1: macOS 26 AppKit KVO crash on shutdown.
                  // Sculpt already saves its UI/window preferences separately via save_prefs.
                  #[cfg(target_os = "macos")]
                  persist_window: false,
                  #[cfg(target_os = "macos")]
                  run_and_return: false,
          ''',already='SCULPT_MAC_TOUCHBAR_EXIT_PILOT_V1')

          ENGINE='crates/engine/src/edit.rs'
          s=file(ENGINE).read_text()
          start=s.index('pub fn move_clips(s: &mut Session, ids: &[ClipId], delta: Samples, to_track: Option<TrackId>) -> usize {')
          end=s.index('\n/// Session-stable original cut location',start)
          new_move='''pub fn move_clips(s: &mut Session, ids: &[ClipId], delta: Samples, to_track: Option<TrackId>) -> usize {
              // SCULPT_CORE_GROUP_MOVE_PRESERVES_XFADE_V1: extract *all* moving clips first,
              // clear destination material before inserting any, then append all moving clips together.
              // The former per-clip place_clip() erased the overlap of the preceding moved clip.
              let moving_ids: std::collections::HashSet<ClipId> = ids.iter().copied().collect();
              let mut joints = Vec::new();
              for t in &s.tracks {
                  for pair in t.clips().windows(2) {
                      let (a, b) = (&pair[0], &pair[1]);
                      let key = sculpt_xfade_join_key(a.id, b.id);
                      if s.edit.values.contains_key(&key) {
                          joints.push((a.id, b.id, key));
                      }
                  }
              }
              // Moving only one side breaks the crossfade association intentionally; remove
              // both linked fades so no misleading standalone fade remains.
              for (a, b, key) in &joints {
                  if moving_ids.contains(a) != moving_ids.contains(b) {
                      if let Some(c) = s.find_clip_mut(*a) { c.fade_out = Fade::default(); }
                      if let Some(c) = s.find_clip_mut(*b) { c.fade_in = Fade::default(); }
                      s.edit.values.remove(key);
                  }
              }
              let mut moving: Vec<(TrackId, Clip)> = Vec::new();
              for t in &mut s.tracks {
                  let tid = t.id;
                  if let Some(pl) = t.playlist_mut() {
                      pl.clips.retain(|c| {
                          if moving_ids.contains(&c.id) && !c.time_locked && !c.edit_locked {
                              moving.push((tid, c.clone()));
                              false
                          } else { true }
                      });
                  }
              }
              let n = moving.len();
              let mut relocated = Vec::with_capacity(n);
              for (tid, mut c) in moving {
                  c.start = c.start.saturating_add(delta).max(0);
                  relocated.push((to_track.unwrap_or(tid), c));
              }
              // Clear only STATIONARY material before any of the moved clips are inserted.
              for (target, c) in &relocated { clear_range(s, *target, c.range(), false); }
              for (target, c) in relocated {
                  if let Some(pl) = s.track_mut(target).and_then(|t| t.playlist_mut()) { pl.clips.push(c); }
              }
              for t in &mut s.tracks { if let Some(pl) = t.playlist_mut() { pl.sort(); } }
              // Keep the saved, undoable crossfade seam aligned with the pair when both move.
              for (a, b, key) in joints {
                  if moving_ids.contains(&a) && moving_ids.contains(&b)
                      && let Some(v) = s.edit.values.get_mut(&key)
                  { *v = (*v + delta as f64).max(0.0); }
              }
              n
          }
          '''
          if 'SCULPT_CORE_GROUP_MOVE_PRESERVES_XFADE_V1' not in s:
              s=s[:start]+new_move+s[end:];file(ENGINE).write_text(s)

          # Test the saved .scraft file with real stored WAV media, not only JSON-to-JSON.
          IO='crates/engine/src/io.rs'
          s=file(IO).read_text()
          if 'mod sculpt_core_session_roundtrip_tests {' not in s:
              s+='''
