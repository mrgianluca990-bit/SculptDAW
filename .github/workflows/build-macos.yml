name: Sculpt DAW — source build and bridge checks
on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sculpt-daw-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,wasm32-unknown-unknown
      - name: Check exact committed sources
        run: cargo check --locked -p sculpt-daw -p soundcraft-cli
      - name: Engine and bridge regression tests
        run: |
          cargo test --locked -p soundcraft-engine --lib
          cargo test --locked -p soundcraft-mix --lib
          cargo test --locked -p soundcraft-ui-egui --lib
          cargo test --locked -p soundcraft-ui-egui --test shortcuts
          cargo test --locked -p soundcraft-playback --lib
          cargo test --locked -p soundcraft-vst3-host --test fixture_e2e
          cargo test --locked -p soundcraft-au-host --test system_units
      - name: Full repository quality gate
        run: cargo xtask ci
      - name: Build universal app with embedded CLI
        run: bash sculpt/build-macos.sh
      - name: Verify archive
        run: |
          shasum -a 256 -c dist/sculpt/Sculpt_DAW_0.4.0_Mac_Universal.zip.sha256
          unzip -t dist/sculpt/Sculpt_DAW_0.4.0_Mac_Universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Sculpt-DAW-Bridge-${{ github.sha }}
          path: dist/sculpt/Sculpt_DAW_0.4.0_Mac_Universal.zip*
          if-no-files-found: error
          retention-days: 14
