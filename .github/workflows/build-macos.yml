name: Sculpt DAW Core 19 - Fixed Finder, Markers and Mixer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sculpt-core19-${{ github.ref }}
  cancel-in-progress: false
jobs:
  macos:
    name: Sculpt DAW Core19 Mac Universal (one build)
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - name: Checkout Sculpt
        uses: actions/checkout@v4
      - name: Checkout pinned SoundCraft sources
        uses: actions/checkout@v4
        with:
          repository: storytold/soundcraft
          ref: 6cf896e76c0ec82a11bf2494f209cfe7c8507f74
          path: soundcraft-upstream
          persist-credentials: false
      - name: Verify approved amber Sculpt DAW app icon
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/sculpt-daw/sculpt-daw-512.png
          test -s QA/SculptDAW_Core17_Patch.py
          echo '923b49c8994363786b46b3a71aef73e5779e97a22a63966d85db63bb1c4555cd  assets/sculpt-daw/sculpt-daw-512.png' | shasum -a 256 -c -
          python3 -m py_compile QA/SculptDAW_Core17_Patch.py
      - name: Restore missing source files and proven Core15 patches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p crates/dsp/src xtask/src
          rsync -a --ignore-existing soundcraft-upstream/crates/dsp/src/ crates/dsp/src/
          if [ ! -f xtask/src/main.rs ]; then cp soundcraft-upstream/xtask/src/main.rs xtask/src/main.rs; fi
          git fetch --no-tags --depth=1 origin 6d0b50cef84523e44c9e6ad1af13b0570574c933
          git show 6d0b50cef84523e44c9e6ad1af13b0570574c933:.github/workflows/build-macos.yml > /tmp/sculpt-core15.yml
          python3 - <<'PY_REPLAY'
          from pathlib import Path
          import subprocess
          src=Path('/tmp/sculpt-core15.yml').read_text(encoding='utf-8')
          names = ['Install Sculpt Core QA menu (do not remove underlying commands)', 'Limit visible plugins to VST3 and Audio Units', 'Patch Sculpt Core 13 - eight slots, fades, crossfade moves, Return, session and exit', 'Sculpt Core 15 - Shared Send, Meter and Crossfade Corrections', 'Sculpt Core 15 - Targeted SoundCraft 0.7 trim fix']
          for name in names:
              key = '      - name: '+name+'\n'
              if src.count(key)!=1: raise SystemExit('Baseline Core15 step not found: '+name)
              section=src.split(key,1)[1].split('\n      - name:',1)[0]
              marker='        run: |\n'
              if section.count(marker)!=1: raise SystemExit('Expected one run block in '+name)
              lines=section.split(marker,1)[1].splitlines()
              code='\n'.join(line[10:] if line.startswith('          ') else line for line in lines)+'\n'
              if not code.strip().startswith('set -euo pipefail'): raise SystemExit('Baseline script prefix wrong: '+name)
              print('CORE15 RESTORE:', name, flush=True)
              subprocess.run(['bash','-euo','pipefail','-c',code],check=True)
          PY_REPLAY
